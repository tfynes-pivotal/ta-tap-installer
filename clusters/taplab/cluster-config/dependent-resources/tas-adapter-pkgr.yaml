#@ load("@ytt:data", "data")
---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageRepository
metadata:
  finalizers:
  - finalizers.packagerepository.packaging.carvel.dev/delete
  name: tas-adapter-repository
  namespace: tap-install
spec:
  fetch:
    imgpkgBundle:
      #@ if data.values.platformRegistryLocation == 'customPlatformRegistrySelection':
      image: #@ data.values.customPlatformRegistryUrl + '/tas-adapter-package-repo:1.3.1'
      #@ else:
      image: tanzu.packages.broadcom.com/app-service-adapter/tas-adapter-package-repo:1.3.1
      #@ end
      #!secretRef:
        #!name: install-registry-dockerconfig